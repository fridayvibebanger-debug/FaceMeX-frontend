[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API redirects (must be before SPA redirect)
[[redirects]]
  from = "/api/auth/*"
  to = "https://facemex-backend.onrender.com/api/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/pro-groups/*"
  to = "/.netlify/functions/pro-groups/:splat"
  status = 200

[[redirects]]
  from = "/api/marketplace/*"
  to = "/.netlify/functions/marketplace/:splat"
  status = 200

[[redirects]]
  from = "/api/youtube/summarize"
  to = "/.netlify/functions/youtube-summarize"
  status = 200
  force = true

# Serve generated route-specific HTML before the SPA fallback.
[[redirects]]
  from = "/ai-for-students"
  to = "/ai-for-students/index.html"
  status = 200

[[redirects]]
  from = "/ai-study-assistant"
  to = "/ai-study-assistant/index.html"
  status = 200

[[redirects]]
